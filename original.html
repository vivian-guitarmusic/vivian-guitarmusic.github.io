<style>
/* Layout: same as the Wix home — centered nav, wide photo, centered name + intro, three pink pill buttons, pink footer band */
:root{
  --bg:#FFFFFF;
  --ink:#181818;        /* 深灰：最深的字色，不用純黑 */
  --muted:#7A7A7A;
  --line:#BEBEBE;       /* 淺灰 */
  --coral:#F69CA4;      /* 深粉紅 */
  --coral-dark:#E9848E;
  --blush:#FFE9EB;      /* 淺粉紅 */
  --pink-soft:#FBD3D7;
  --sans:"Avenir","Avenir Next","Nunito Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --script:"Dancing Script","Brush Script MT",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;margin:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--coral-dark);outline-offset:3px;border-radius:4px}

nav{padding-block:22px 18px}
nav ul{list-style:none;margin:0 auto;padding:0;display:flex;flex-wrap:nowrap;justify-content:center;gap:20px;max-width:720px;font-size:14px;white-space:nowrap}
nav a{text-decoration:none;padding:4px 0;border-bottom:1.5px solid transparent}
nav a:hover,nav a[aria-current]{border-color:var(--coral);color:var(--coral-dark)}

footer{background:var(--blush);text-align:center;padding-block:28px 34px}
.social{display:flex;justify-content:center;gap:26px;list-style:none;margin:0;padding:0}
.social a{display:flex;width:40px;height:40px;align-items:center;justify-content:center;color:var(--coral);transition:color .2s}
.social a:hover{color:var(--coral-dark)}
.social svg{width:30px;height:30px;fill:currentColor}
.copy{margin:20px 0 0;font-size:12px;color:var(--muted)}


:root{--rose:#B9505F;--pale:#FFF5F6}
.sec{padding-block:40px 20px;max-width:860px;margin:0 auto}
.sec:last-child{padding-bottom:56px}
h2{margin:0;color:var(--coral);font-weight:700;font-size:clamp(19px,5.4vw,22px);border-left:4px solid var(--coral);padding-left:12px;line-height:1.2;letter-spacing:.04em}
.sub{margin:8px 0 0;color:var(--muted);font-size:14px}
.single{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;margin-top:22px}
.cd{width:100%;max-width:100%;display:block}
.player{background:var(--pale);border-radius:18px;padding:18px 16px 8px}
.wave{display:flex;align-items:center;gap:3px;height:46px}
.wave i{flex:1;background:var(--pink-soft);border-radius:3px;min-height:4px}
.wave.on i{animation:wv 1.1s ease-in-out infinite alternate}
@keyframes wv{to{transform:scaleY(.45)}}
.wave i:nth-child(3n){animation-delay:-.3s}.wave i:nth-child(3n+1){animation-delay:-.7s}
@media (prefers-reduced-motion:reduce){.wave.on i{animation:none}}
.plats{margin-top:12px;display:grid}
.plat{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--blush);text-decoration:none}
.ic{display:flex;color:var(--rose)}.ic svg{width:28px;height:28px}
.pn{font-weight:500;font-size:15px;color:var(--ink)}
.pb{background:var(--blush);color:var(--rose);font-weight:700;font-size:13px;padding:4px 16px;border-radius:99px}
.plat:hover .pb{background:var(--coral);color:#fff}
.svembed{min-width:0;height:100px;overflow:hidden}
.svembed iframe{width:100%;max-width:100%;height:100px;border:0;display:block}
.demos{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;margin-top:22px}
.demo{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:8px;border:1px solid var(--line);text-decoration:none;min-width:0}
.demo img{width:64px;height:64px;object-fit:cover;display:block;max-width:100%}
.dt{display:grid;min-width:0}.dt b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dt small{color:var(--muted);font-size:12px}
.svb{display:flex;color:var(--coral)}.svb svg{width:26px;height:26px}
.comps{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px}
.comp{margin:0;text-align:center;min-width:0}
.comp img{width:100%;max-width:100%;aspect-ratio:1;object-fit:cover;display:block}
.cd{mix-blend-mode:multiply}
.comp figcaption{display:grid;justify-items:center;gap:6px;margin-top:12px}
.comp b{font-weight:500;font-size:clamp(15px,4.4vw,19px);color:var(--muted);line-height:1.45}
.aw{font-size:14px;color:var(--muted)}.aw em{font-style:normal;color:var(--rose);font-weight:700;margin-left:.4em}
.lis{display:inline-flex;align-items:center;gap:6px;background:var(--blush);color:var(--rose);font-weight:700;font-size:13px;padding:4px 14px 4px 5px;border-radius:99px;text-decoration:none;margin-top:4px}
.lis .ic svg{width:20px;height:20px}
@media (max-width:620px){
  .single{grid-template-columns:1fr;gap:16px}
  .demos{grid-template-columns:1fr;gap:10px}
  .comps{gap:14px}
}
@media (max-width:520px){nav ul{justify-content:space-between;gap:0;font-size:clamp(11px,3.3vw,14px)}}
</style>
</head>
