<style>
/* Layout: same as the Wix home — centered nav, wide photo, centered name + intro, three pink pill buttons, pink footer band */
:root{
  --bg:#FFFFFF;
  --ink:#181818;        /* 深灰：最深的字色，不用純黑 */
  --muted:#7A7A7A;
  --line:#BEBEBE;       /* 淺灰 */
  --coral:#F69CA4;      /* 深粉紅 */
  --coral-dark:#E9848E;
  --blush:#FFE9EB;      /* 淺粉紅 */
  --pink-soft:#FBD3D7;
  --sans:"Avenir","Avenir Next","Nunito Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --script:"Dancing Script","Brush Script MT",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;margin:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--coral-dark);outline-offset:3px;border-radius:4px}

nav{padding-block:22px 18px}
nav ul{list-style:none;margin:0 auto;padding:0;display:flex;flex-wrap:nowrap;justify-content:center;gap:20px;max-width:720px;font-size:14px;white-space:nowrap}
nav a{text-decoration:none;padding:4px 0;border-bottom:1.5px solid transparent}
nav a:hover,nav a[aria-current]{border-color:var(--coral);color:var(--coral-dark)}

footer{background:var(--blush);text-align:center;padding-block:28px 34px}
.social{display:flex;justify-content:center;gap:26px;list-style:none;margin:0;padding:0}
.social a{display:flex;width:40px;height:40px;align-items:center;justify-content:center;color:var(--coral);transition:color .2s}
.social a:hover{color:var(--coral-dark)}
.social svg{width:30px;height:30px;fill:currentColor}
.copy{margin:20px 0 0;font-size:12px;color:var(--muted)}


.sec{padding-block:44px 64px;max-width:820px;margin:0 auto;text-align:center}
h2{margin:0;color:var(--coral);font-weight:500;font-size:clamp(28px,8vw,36px);letter-spacing:.08em}
.sub{margin:18px 0 0;color:var(--muted);font-size:15px;line-height:1.9}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,4vw,36px);margin-top:40px}
.pay{background:var(--blush);border-radius:18px;padding:28px 20px 26px;display:flex;flex-direction:column;align-items:center;min-width:0;position:relative;overflow:hidden}
.pay::before,.pay::after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.55}
.pay::before{width:120px;height:120px;right:-40px;top:-40px}
.pay::after{width:80px;height:80px;left:-30px;bottom:-30px}
.qrbox{position:relative;z-index:1;background:#fff;border-radius:14px;padding:14px;width:min(220px,100%);box-shadow:0 4px 14px rgba(246,156,164,.25)}
.qrbox img{display:block;width:100%;max-width:100%;aspect-ratio:512/504}
.brand{position:relative;z-index:1;margin-top:18px;font-weight:800;font-size:24px;letter-spacing:.02em;color:var(--ink)}
.brand em{font-style:normal;background:#4CC764;color:#fff;border-radius:4px;padding:0 6px;margin-left:4px}
.brand.tw img{display:block;height:30px;width:auto;max-width:100%}
.scan{position:relative;z-index:1;margin:6px 0 0;font-weight:700;font-size:15px;color:var(--ink)}
.scan span{color:var(--coral)}
.note{position:relative;z-index:1;margin:2px 0 0;font-size:12px;color:var(--muted)}
.mob{display:none;position:relative;z-index:1;margin-top:14px;width:100%;max-width:240px}
.btn{display:block;text-align:center;background:var(--coral);color:#fff;font-weight:700;text-decoration:none;padding:10px 0;border-radius:99px;font-size:15px}
.btn.ghost{background:#fff;color:var(--coral-dark)}
.tip{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
@media (max-width:700px),(pointer:coarse){
  .qrs{grid-template-columns:1fr;max-width:340px;margin-inline:auto}
  .mob{display:block}
  .scan.desk,.note.desk{display:none}
  .qrbox{width:150px;padding:10px}
}
@media (max-width:520px){nav ul{justify-content:space-between;gap:0;font-size:clamp(11px,3.3vw,14px)}}
</style>
</head>
