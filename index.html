<style>
/* Layout: same as the Wix home — centered nav, wide photo, centered name + intro, three pink pill buttons, pink footer band */
:root{
  --bg:#FFFFFF;
  --ink:#181818;        /* 深灰：最深的字色，不用純黑 */
  --muted:#7A7A7A;
  --line:#BEBEBE;       /* 淺灰 */
  --coral:#F69CA4;      /* 深粉紅 */
  --coral-dark:#E9848E;
  --blush:#FFE9EB;      /* 淺粉紅 */
  --pink-soft:#FBD3D7;
  --sans:"Avenir","Avenir Next","Nunito Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --script:"Dancing Script","Brush Script MT",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;margin:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--coral-dark);outline-offset:3px;border-radius:4px}

nav{padding-block:22px 18px}
nav ul{list-style:none;margin:0 auto;padding:0;display:flex;flex-wrap:nowrap;justify-content:center;gap:20px;max-width:720px;font-size:14px;white-space:nowrap}
nav a{text-decoration:none;padding:4px 0;border-bottom:1.5px solid transparent}
nav a:hover,nav a[aria-current]{border-color:var(--coral);color:var(--coral-dark)}

.hero{max-width:980px;margin:0 auto}
.hero img{display:block;width:100%;max-width:100%;aspect-ratio:940/540;object-fit:cover;object-position:58% 45%}

.intro{text-align:center;padding-block:40px 36px}
h1{margin:0;color:var(--coral);line-height:1.1;font-weight:400;display:flex;justify-content:center;align-items:baseline;gap:2px}
h1 .en{font-family:var(--script);font-weight:600;font-size:clamp(54px,15vw,76px)}
h1 .zh{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:600;font-size:clamp(44px,12.5vw,64px);letter-spacing:.01em}
.title{margin:26px 0 0;font-weight:700;font-size:18px;letter-spacing:.06em}
.roles{margin:4px 0 0;color:var(--muted);font-size:15px;letter-spacing:.08em}
.roles span{color:var(--line);margin:0 .35em}
.desc{margin:22px 0 0;font-size:14px;line-height:1.85}

.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,4vw,28px);margin:36px auto 0;max-width:600px}
.btns a{display:block;white-space:nowrap;text-align:center;background:var(--coral);color:#fff;font-weight:700;font-size:15px;letter-spacing:.08em;text-decoration:none;padding:9px 0;border-radius:99px;transition:background .2s}
.btns a:hover{background:var(--coral-dark)}

footer{background:var(--blush);text-align:center;padding-block:28px 34px}
.social{display:flex;justify-content:center;gap:26px;list-style:none;margin:0;padding:0}
.social a{display:flex;width:40px;height:40px;align-items:center;justify-content:center;color:var(--coral);transition:color .2s}
.social a:hover{color:var(--coral-dark)}
.social svg{width:30px;height:30px;fill:currentColor}
.copy{margin:20px 0 0;font-size:12px;color:var(--muted)}

@media (max-width:520px){
  nav ul{justify-content:space-between;gap:0;font-size:clamp(11px,3.3vw,14px)}
  .btns a{font-size:clamp(12px,3.8vw,15px);letter-spacing:.04em;padding:8px 0}
}
</style>
</head>
