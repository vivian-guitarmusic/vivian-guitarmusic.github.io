<style>
/* Layout: same as the Wix home — centered nav, wide photo, centered name + intro, three pink pill buttons, pink footer band */
:root{
  --bg:#FFFFFF;
  --ink:#181818;        /* 深灰：最深的字色，不用純黑 */
  --muted:#7A7A7A;
  --line:#BEBEBE;       /* 淺灰 */
  --coral:#F69CA4;      /* 深粉紅 */
  --coral-dark:#E9848E;
  --blush:#FFE9EB;      /* 淺粉紅 */
  --pink-soft:#FBD3D7;
  --sans:"Avenir","Avenir Next","Nunito Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --script:"Dancing Script","Brush Script MT",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;margin:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--coral-dark);outline-offset:3px;border-radius:4px}

nav{padding-block:22px 18px}
nav ul{list-style:none;margin:0 auto;padding:0;display:flex;flex-wrap:nowrap;justify-content:center;gap:20px;max-width:720px;font-size:14px;white-space:nowrap}
nav a{text-decoration:none;padding:4px 0;border-bottom:1.5px solid transparent}
nav a:hover,nav a[aria-current]{border-color:var(--coral);color:var(--coral-dark)}

footer{background:var(--blush);text-align:center;padding-block:28px 34px}
.social{display:flex;justify-content:center;gap:26px;list-style:none;margin:0;padding:0}
.social a{display:flex;width:40px;height:40px;align-items:center;justify-content:center;color:var(--coral);transition:color .2s}
.social a:hover{color:var(--coral-dark)}
.social svg{width:30px;height:30px;fill:currentColor}
.copy{margin:20px 0 0;font-size:12px;color:var(--muted)}


.sec{padding-block:44px 48px;max-width:900px;margin:0 auto}
h2{margin:0 0 28px;text-align:center;color:var(--coral);font-weight:700;font-size:clamp(20px,5.6vw,24px);letter-spacing:.04em}
h2 span{font-weight:500}
.lives{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3.5vw,28px)}
.vbox{display:block;aspect-ratio:9/16;max-width:100%;overflow:hidden;background:var(--blush)}
.yt{position:relative;padding:0;border:0;cursor:pointer;width:100%;font:inherit}
.yt .play{position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%);transition:transform .2s}
.yt .play circle{fill:rgba(24,24,24,.45);stroke:#fff;stroke-width:2}.yt .play path{fill:#fff}
.yt:hover .play{transform:translate(-50%,-50%) scale(1.08)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vbox img,.thumb img,.slide img,.photos img{display:block;width:100%;height:100%;object-fit:cover}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.rail::-webkit-scrollbar{display:none}
.cover{display:flex;flex-direction:column;scroll-snap-align:start;min-width:0;text-align:center}
.thumb{display:block;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:#eee}
.ch{margin-top:12px;font-size:12px;color:var(--muted)}
.ct{margin-top:2px;font-size:16px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 0}
.evband{background:var(--coral)}
.evband h2{color:#fff}
.show{position:relative}
.slides{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 2*clamp(10px,3.5vw,28px))/3);gap:clamp(10px,3.5vw,28px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.slides::-webkit-scrollbar{display:none}
.slide{aspect-ratio:1;max-width:100%;scroll-snap-align:start;background:#fff;overflow:hidden}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:var(--coral-dark);font-size:18px;line-height:30px;cursor:pointer;padding:0}
.arrow.prev{left:-8px}.arrow.next{right:-8px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,2.5vw,28px)}
.photos img{aspect-ratio:4/3;max-width:100%}
@media (max-width:520px){
  nav ul{justify-content:space-between;gap:0;font-size:clamp(11px,3.3vw,14px)}
  .rail{grid-auto-columns:78%}
  .ct{font-size:14px}
}
@media (prefers-reduced-motion:reduce){.slides{scroll-behavior:auto}}
</style>

<script>
(function(){
  const s=document.getElementById('slides');
  const step=()=>s.firstElementChild.getBoundingClientRect().width+parseFloat(getComputedStyle(s).columnGap||0);
  function go(d){const max=s.scrollWidth-s.clientWidth;let x=s.scrollLeft+d*step();if(x>max+2)x=0;if(x<-2)x=max;s.scrollTo({left:x});}
  document.getElementById('next').onclick=()=>go(1);
  document.getElementById('prev').onclick=()=>go(-1);
  let t=setInterval(()=>go(1),3500);
  s.addEventListener('pointerdown',()=>clearInterval(t),{once:true});
})();
</script>

<script>
document.querySelectorAll('button.yt').forEach(b=>b.addEventListener('click',()=>{
  const f=document.createElement('iframe');
  f.src='https://www.youtube-nocookie.com/embed/'+b.dataset.id+'?autoplay=1&playsinline=1&rel=0';
  f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.title=b.getAttribute('aria-label');
  b.replaceChildren(f);b.style.cursor='default';
},{once:true}));
</script>
